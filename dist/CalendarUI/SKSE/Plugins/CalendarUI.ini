; CalendarUI settings
;
; Appearance is not configured here -- it lives in Interface/CalendarUI.swf,
; which is the file a UI replacer overrides.

[General]
; Scan code of the key that opens the calendar. 0x26 = L.
; Codes: https://ck.uesp.net/wiki/Input_Script
;Hotkey=0x26

; How much is written to
; Documents\My Games\Skyrim Special Edition\SKSE\CalendarUI.log
;
;   off    nothing at all
;   error  only outright failures
;   warn   failures, plus bad event/translation data that was skipped
;   info   everything, including what loaded and every month opened
;   debug  as info, with extra detail
;
; Default is warn: a working setup writes almost nothing, but anything the
; Calendar had to throw away still says so. Switch to info when reporting a
; problem -- that is the level that shows what actually loaded.
LogLevel=warn

[Controls]
; Month navigation, as DX scan codes (https://ck.uesp.net/wiki/Input_Script).
;
; These are sent to the .swf, which both listens for them AND draws the
; matching key icon from SkyUI's ButtonArt -- so changing one here moves the
; binding and its picture together; they cannot end up disagreeing.
;
; Gamepad prompts are fixed (LB / RB / Y) and are not configurable here.
; E (0x12) is avoided on purpose: the game already claims it in menu
; contexts, so the keypress never reaches this menu.
PrevMonthKey=0x10   ; Q
NextMonthKey=0x13   ; R
TodayKey=0x14       ; T

; --- Custom notes ----------------------------------------------------------
;
; NoteKey opens the note editor for the selected day, from the day popup.
NoteKey=0x31        ; N

; NoteDeleteKey removes the note being edited. It opens a Yes / No
; confirmation window; nothing is deleted until you choose Yes.
;
; F4 by default: a function key is never text, so it cannot be confused with
; typing into the note fields and needs no modifier.
;
; Set NoteDeleteNeedsCtrl=1 if you rebind this to a plain letter -- there the
; modifier is the only thing separating the command from the character.
NoteDeleteKey=0x3E  ; F4
NoteDeleteNeedsCtrl=0

; The keys below are used for the ON-SCREEN HINT ONLY and do not rebind
; anything. The editor matches save/cancel/switch through Scaleform's own
; navigation events so they work on a gamepad as well as a keyboard, which
; means the actual keys are always Enter / Escape / Tab. Changing these would
; make the hint disagree with reality, so leave them alone.
NoteSaveKey=0x1C    ; Enter
NoteCancelKey=0x01  ; Escape
NoteSwitchKey=0x0F  ; Tab

[Moons]
; The lunar cycle, shown as a small moon in the top-right corner of a day.
;
; All eight phases are marked, on the day each one BEGINS -- about ten days a
; month, one every three days. (Marking every day OF a phase would put an icon
; on every single cell, since a phase lasts three days.)
;
; Set to 0 to turn the moons off entirely.
ShowMoonPhases=1

; The length of the full cycle, and how long one phase lasts, in days.
;
; Vanilla Skyrim is 24 days over eight phases -- three days each -- and that is
; what these default to. The moons are flat billboards with eight pre-rendered
; textures, and the game picks one by a modulo on the day counter; there is no
; simulation behind it, and both moons always show the same phase.
;
; These are settings because the moons are the one thing a mod is likely to
; have changed underneath the calendar. Moons and Stars - Sky Overhaul, for
; instance, runs Masser on 24 days and Secunda on 20. There is no way to ask
; such a mod what it did, so if you run one, set the cycle to match it here.
;
; CycleDays should normally be DaysPerPhase x 8. If it is shorter, the later
; phases simply never come up (and the log says so); if it is longer, the last
; phase runs long. Both are allowed -- neither is likely to be what you meant.
CycleDays=24
DaysPerPhase=3

[Seasons]
; Which month each season begins on.
;
; Skyrim has no seasons of its own -- this is the Calendar's own notion, shown
; next to the month name -- so there is no "correct" set to inherit and it is
; yours to define.
;
; A season runs from its start month until the next season begins, so they do
; not have to be equal lengths: for a long winter and a short spring, just move
; the boundaries. The order is not assumed either, so the whole cycle can be
; shifted or reversed.
;
; Write a month name or a 0-based index (0 = Morning Star ... 11 = Evening
; Star). Names are the standard Tamriel ones and are not case sensitive.
;
; The defaults put deep winter over the turn of the year and step in
; three-month blocks from there.
WinterStart=Evening Star
SpringStart=First Seed
SummerStart=Midyear
AutumnStart=Hearthfire
